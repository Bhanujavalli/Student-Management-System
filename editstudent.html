<html>
    <head>
        <style>
            nav{
                background-color:black;
                color:white;
                height:50px;
                text-align:center ;
                line-height:50px;

            }
            nav a{
                color:white;
                text-decoration:none;
                font-size:20px;
                margin:0 15px;
            }
            nav a:hover{
                color:yellow;
            }
            form{
                text-align:center;
                border:1px solid black;
                width:300px;
                margin:10px auto;
            }
            label{
                display:block;
            }
           
            
        </style>
        <script>
            window.onload=async function(){
                const params=new URLSearchParams(window.location.search);
                const id=params.get('id');
                const res=await fetch(`http://localhost:4000/students/${id}`)
                const student=await res.json();
                document.getElementById("name").value=student.name;
               document.getElementById("age").value=student.age;
                document.getElementById("grade").value=student.grade;
            }
            async function updatestudent(event){
                event.preventDefault();
                const params=new URLSearchParams(window.location.search);
                const id=params.get('id');
                const name=document.getElementById("name").value;
                const age=document.getElementById("age").value;
                const grade=document.getElementById("grade").value;
                const student={name:name,age:age,grade:grade};
                 const res=await fetch(`http://localhost:4000/students/${id}`,
                    {method:"PUT",
                                         headers: {
        "Content-Type": "application/json"
    },
                        body:JSON.stringify(student)
                    }

                );
                if(res.ok){
                     window.location.href="viewstudents.html";
                }
                else{
                    alert("error");
                }
            }
        </script>
        </head>
    <body>
        <nav>
            <ul>
                <a href="dashboard.html">Dashboard</a>
                <a href="addstudent.html">Add Student</a>
                <a href="viewstudents.html">View Students</a>
                <a href="logout.html">Logout</a>
            </ul>
        </nav>
        <form onsubmit="updatestudent(event)">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" ><br>
            <label for="age">Age:</label>
            <input type="text" id="age" name="age" ><br>
            <label for="grade">Grade:</label>
            <input type="text" id="grade" name="grade" ><br>
            <input type="submit" value="Update">
        </form>
    </body>
</html>
