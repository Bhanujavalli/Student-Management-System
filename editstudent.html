<html>
    <head>
        <style>
            nav{
                background-color:black;
                color:white;
                height:50px;
                text-align:center ;
                line-height:50px;

            }
            nav a{
                color:white;
                text-decoration:none;
                font-size:20px;
                margin:0 15px;
            }
            nav a:hover{
                color:yellow;
            }
            form{
                text-align:center;
                border:1px solid black;
                width:300px;
                margin:10px auto;
            }
            label{
                display:block;
            }
           
            
        </style>
        <script>
            window.onload=function(){
                let students=JSON.parse(localStorage.getItem("students")) ||[];
                const params=new URLSearchParams(window.location.search);
                const index=params.get("index");
                document.getElementById("name").value=students[index].name;
               document.getElementById("age").value=students[index].age;
                document.getElementById("grade").value=students[index].grade;
            }
            function updatestudent(event){
                event.preventDefault();
                let students=JSON.parse(localStorage.getItem("students")) ||[];
                const params=new URLSearchParams(window.location.search);
                const index=params.get("index");
                students[index]={
                    name:document.getElementById("name").value,
                    age:document.getElementById("age").value,
                    grade:document.getElementById("grade").value
                };
                localStorage.setItem("students",JSON.stringify(students));
                window.location.href="viewstudents.html";
            }
        </script>
        </head>
    <body>
        <nav>
            <ul>
                <a href="dashboard.html">Dashboard</a>
                <a href="addstudent.html">Add Student</a>
                <a href="viewstudents.html">View Students</a>
                <a href="logout.html">Logout</a>
            </ul>
        </nav>
        <form onsubmit="updatestudent(event)">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" ><br>
            <label for="age">Age:</label>
            <input type="text" id="age" name="age" ><br>
            <label for="grade">Grade:</label>
            <input type="text" id="grade" name="grade" ><br>
            <input type="submit" value="Update">
        </form>
    </body>
</html>
